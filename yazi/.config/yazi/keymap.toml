#:schema https://yazi-rs.github.io/schemas/keymap.json

# Keep only personal bindings; inherit the defaults shipped with each Yazi version.
[mgr]
prepend_keymap = [
	{ on = "K", run = "arrow -5", desc = "Previous 5 files" },
	{ on = "J", run = "arrow 5", desc = "Next 5 files" },
	{ on = "l", run = "plugin smart-enter", desc = "Enter directory or open file" },
	{ on = "t", run = "tab_create --current", desc = "Create a new tab with CWD" },
]
