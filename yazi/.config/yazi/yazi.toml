#:schema https://yazi-rs.github.io/schemas/yazi.json

# Personal preferences; leave openers, previews and task settings to Yazi defaults.
[mgr]
ratio = [ 1, 4, 3 ]
sort_by = "alphabetical"
sort_dir_first = true
show_hidden = false
show_symlink = true
scrolloff = 5

# init.lua enables the Git status display; these fetchers supply its data.
[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"
