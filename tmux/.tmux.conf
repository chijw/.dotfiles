set -g default-shell /bin/zsh
set -g default-command ""

set -g set-clipboard on
setw -g mode-keys vi
set -g mouse on
set -g history-limit 10000

bind -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-toggle
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi j send-keys -X cursor-down
bind -T copy-mode-vi k send-keys -X cursor-up
bind -T copy-mode-vi h send-keys -X cursor-left
bind -T copy-mode-vi l send-keys -X cursor-right
bind -T copy-mode-vi J send-keys -N 5 -X cursor-down
bind -T copy-mode-vi K send-keys -N 5 -X cursor-up
bind -T copy-mode-vi H send-keys -N 5 -X cursor-left
bind -T copy-mode-vi L send-keys -N 5 -X cursor-right
bind -T copy-mode-vi I send-keys -X start-of-line
bind -T copy-mode-vi A send-keys -X end-of-line
bind -T copy-mode-vi Y send-keys -X copy-end-of-line
# Copies also reach the outer terminal via set-clipboard (OSC 52), which is
# all a remote Linux host needs; macOS additionally pipes to pbcopy.
if 'command -v pbcopy' {
  bind -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"
} {
  bind -T copy-mode-vi y send-keys -X copy-selection
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
}

# ------------------ Theme: Catppuccin Mocha, neutral gray (same as kitty/nvim) ------------------
# Palette: base #1f1f21  mantle #18181a  surface0 #2c2c2f
#          surface1 #3a3a3e  blue #89b4fa  text #cdd6f4
#          subtext1 #bac2de  subtext0 #a6adc8

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,tmux*:clipboard"

set -g renumber-windows on

# Status bar
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#cdd6f4"

set -g status-left-length 30
set -g status-left "#[fg=#1f1f21,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=default,nobold] "

set -g status-right-length 60
set -g status-right "#[fg=#2c2c2f,bg=default]#[fg=#bac2de,bg=#2c2c2f] %Y-%m-%d #[fg=#89b4fa,bg=#2c2c2f]#[fg=#1f1f21,bg=#89b4fa,bold] %H:%M "

set -g window-status-separator ""
set -g window-status-format "#[fg=#a6adc8,bg=default] #I #W "
set -g window-status-current-format "#[fg=#3a3a3e,bg=default]#[fg=#cdd6f4,bg=#3a3a3e,bold] #I #W #[fg=#3a3a3e,bg=default]"

# Panes, messages, copy-mode selection, clock
set -g pane-border-style "fg=#2c2c2f"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#2c2c2f,fg=#cdd6f4"
set -g message-command-style "bg=#2c2c2f,fg=#cdd6f4"
set -g mode-style "bg=#3a3a3e,fg=#cdd6f4"
set -g clock-mode-colour "#89b4fa"
