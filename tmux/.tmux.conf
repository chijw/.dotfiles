set -g set-clipboard on
setw -g mode-keys vi
set -g mouse on
set -g history-limit 10000

bind -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-toggle
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi j send-keys -X cursor-down
bind -T copy-mode-vi k send-keys -X cursor-up
bind -T copy-mode-vi h send-keys -X cursor-left
bind -T copy-mode-vi l send-keys -X cursor-right
bind -T copy-mode-vi J send-keys -N 5 -X cursor-down
bind -T copy-mode-vi K send-keys -N 5 -X cursor-up
bind -T copy-mode-vi H send-keys -N 5 -X cursor-left
bind -T copy-mode-vi L send-keys -N 5 -X cursor-right
bind -T copy-mode-vi I send-keys -X start-of-line
bind -T copy-mode-vi A send-keys -X end-of-line
bind -T copy-mode-vi Y send-keys -X copy-end-of-line
bind -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"

# ------------------ Theme: Catppuccin Macchiato ------------------
# Palette: base #24273a  mantle #1e2030  surface0 #363a4f
#          surface1 #494d64  blue #8aadf4  text #cad3f5
#          subtext1 #b8c0e0  subtext0 #a5adcb

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,clipboard"

set -g renumber-windows on

# Status bar
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e2030,fg=#cad3f5"

set -g status-left-length 30
set -g status-left "#[fg=#24273a,bg=#8aadf4,bold] #S #[fg=#8aadf4,bg=#1e2030,nobold] "

set -g status-right-length 60
set -g status-right "#[fg=#363a4f,bg=#1e2030]#[fg=#b8c0e0,bg=#363a4f] %Y-%m-%d #[fg=#8aadf4,bg=#363a4f]#[fg=#24273a,bg=#8aadf4,bold] %H:%M "

set -g window-status-separator ""
set -g window-status-format "#[fg=#a5adcb,bg=#1e2030] #I #W "
set -g window-status-current-format "#[fg=#494d64,bg=#1e2030]#[fg=#cad3f5,bg=#494d64,bold] #I #W #[fg=#494d64,bg=#1e2030]"

# Panes, messages, copy-mode selection, clock
set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "fg=#8aadf4"
set -g message-style "bg=#363a4f,fg=#cad3f5"
set -g message-command-style "bg=#363a4f,fg=#cad3f5"
set -g mode-style "bg=#494d64,fg=#cad3f5"
set -g clock-mode-colour "#8aadf4"

