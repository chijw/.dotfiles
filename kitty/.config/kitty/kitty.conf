# kitty.conf — migrated from wezterm (~/.dotfiles/wezterm)
# Reload: ctrl+cmd+, (macOS). Note: changes to macos_option_as_alt,
# hide_window_decorations, background_opacity and listen_on need a full restart.

# -----------------
# Font
# -----------------
# kitty requires a monospace primary font, so the wezterm "Propo" variant
# is not usable here — use the Mono variant instead.
font_family CaskaydiaCove Nerd Font Mono
font_size 20.0

# CJK: force Noto Sans CJK SC (matches the wezterm fallback stack; without
# this kitty's automatic macOS fallback picks PingFang SC instead).
# CJK Ext B+ (U+20000+) is left to automatic fallback — this Noto build
# barely covers it. Emoji fall back to Apple Color Emoji automatically.
symbol_map U+3000-U+303F,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FE30-U+FE4F,U+FF00-U+FFEF Noto Sans CJK SC

# Nerd Font icons: use the non-Mono variant for full-size icons (the Mono
# variant pre-shrinks every icon into one cell, which is why yazi icons
# looked smaller than in wezterm). When an icon is followed by a space,
# kitty renders it larger into that extra cell.
symbol_map U+e000-U+e00a,U+e0a0-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ebeb,U+ed00-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 CaskaydiaCove Nerd Font

# -----------------
# Window
# -----------------
# titlebar-only ≈ wezterm window_decorations = "RESIZE": keeps macOS rounded
# corners AND the (hidden) close button, so yabai's `window --close` (alt+q)
# still works — titlebar-and-corners removes the button and squares corners.
hide_window_decorations titlebar-only
confirm_os_window_close 0
tab_bar_style hidden
# don't echo the window title into the macOS menubar
macos_show_window_title_in window

# background_blur only takes effect while background_opacity < 1
background_opacity 0.85
background_blur 20

# -----------------
# Cursor
# -----------------
cursor_shape beam
# default stops blinking after 15s idle; 0 = keep blinking (wezterm BlinkingBar)
cursor_stop_blinking_after 0

# -----------------
# Keyboard (macOS)
# -----------------
# Both Options as Alt, like wezterm send_composed_key_when_*_alt = false
macos_option_as_alt yes

# -----------------
# Theme
# -----------------
include themes/catppuccin-macchiato.conf
# overrides must come after the include (last one wins)
background #1f1f1f

# -----------------
# Scrollback / copy mode (kitty-scrollback.nvim)
# -----------------
allow_remote_control socket-only
listen_on unix:/tmp/kitty
shell_integration enabled

action_alias kitty_scrollback_nvim kitten /Users/chijw/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py

# vim-style copy mode, same binding as the old wezterm ActivateCopyMode
map alt+shift+a kitty_scrollback_nvim
# browse last command's output (needs shell integration)
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
