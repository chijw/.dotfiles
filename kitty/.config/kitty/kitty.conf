# Reload: ctrl+cmd+, (macOS). macos_option_as_alt, hide_window_decorations,
# background_opacity and listen_on need a full restart.

# Font
font_family CaskaydiaCove Nerd Font Mono
font_size 20.0

# font_family      IoskeleyMonoTerm Nerd Font Mono
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
# font_size        20.0

# CJK: force Noto Sans CJK SC; kitty's automatic macOS fallback picks PingFang SC.
symbol_map U+3000-U+303F,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FE30-U+FE4F,U+FF00-U+FFEF Noto Sans CJK SC

# Nerd Font icons: the non-Mono variant keeps icons full-size (Mono shrinks
# every icon into one cell).
symbol_map U+e000-U+e00a,U+e0a0-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ebeb,U+ed00-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 CaskaydiaCove Nerd Font

# Window
# titlebar-only keeps the rounded corners and the (hidden) close button, so
# yabai's `window --close` still works.
hide_window_decorations titlebar-only
confirm_os_window_close 0
tab_bar_style hidden
macos_show_window_title_in window
# background_blur only takes effect while background_opacity < 1
background_opacity 0.85
background_blur 20

# Cursor
cursor_shape beam
cursor_stop_blinking_after 0

# Keyboard: both Options act as Alt
macos_option_as_alt yes

# Clipboard: let programs read it without the per-paste confirmation prompt
clipboard_control write-clipboard write-primary read-clipboard read-primary

# Theme (overrides must come after the include)
include themes/catppuccin-macchiato.conf
background #1f1f1f

# Scrollback / copy mode (kitty-scrollback.nvim)
allow_remote_control socket-only
listen_on unix:/tmp/kitty
shell_integration enabled

action_alias kitty_scrollback_nvim kitten /Users/chijw/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py

# vim-style copy mode
map alt+shift+a kitty_scrollback_nvim
# browse the last command's output (needs shell integration)
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
