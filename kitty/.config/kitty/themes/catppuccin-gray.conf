# vim:ft=kitty

## name:     Catppuccin Kitty Mocha (neutral gray)
## author:   Catppuccin Org
## license:  MIT
## upstream: https://github.com/catppuccin/kitty/blob/main/themes/macchiato.conf
## blurb:    Soothing pastel theme for the high-spirited!



# The basic colors
foreground              #cdd6f4
background              #1f1f21
selection_foreground    #1f1f21
selection_background    #f5e0dc

# Cursor colors
cursor                  #f5e0dc
cursor_text_color       #1f1f21

# Scrollbar colors
scrollbar_handle_color  #9d9da3
scrollbar_track_color   #3a3a3e

# URL color when hovering with mouse
url_color               #f5e0dc

# Kitty window border colors
active_border_color     #b4befe
inactive_border_color   #6c6c72
bell_border_color       #f9e2af

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #121214
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #18181a
tab_bar_background      #121214

# Colors for marks (marked text in the terminal)
mark1_foreground #1f1f21
mark1_background #b4befe
mark2_foreground #1f1f21
mark2_background #cba6f7
mark3_foreground #1f1f21
mark3_background #74c7ec

# The 16 terminal colors

# black
color0 #3a3a3e
color8 #4a4a4f

# red
color1 #f38ba8
color9 #f38ba8

# green
color2  #a6e3a1
color10 #a6e3a1

# yellow
color3  #f9e2af
color11 #f9e2af

# blue
color4  #89b4fa
color12 #89b4fa

# magenta
color5  #f5c2e7
color13 #f5c2e7

# cyan
color6  #94e2d5
color14 #94e2d5

# white
color7  #bac2de
color15 #a6adc8
